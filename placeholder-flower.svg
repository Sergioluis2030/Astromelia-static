<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBF7FF" />
      <stop offset="50%" stop-color="#F3EBF9" />
      <stop offset="100%" stop-color="#E9DCF4" />
    </linearGradient>

    <linearGradient id="petalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9B8AB5" />
      <stop offset="100%" stop-color="#5C2E8E" />
    </linearGradient>

    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5B8A6B" />
      <stop offset="100%" stop-color="#2E5D3E" />
    </linearGradient>

    <radialGradient id="glowGrad" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#EDE6F7" stop-opacity="0" />
    </radialGradient>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#5C2E8E" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="800" fill="url(#bgGrad)" />

  <!-- Subtle Decorative Border -->
  <rect x="28" y="28" width="744" height="744" rx="28" fill="none" stroke="#5C2E8E" stroke-opacity="0.08" stroke-width="2" />
  <rect x="40" y="40" width="720" height="720" rx="20" fill="none" stroke="#C8A66A" stroke-opacity="0.18" stroke-dasharray="6,6" stroke-width="1.5" />

  <!-- Center Soft Glow -->
  <circle cx="400" cy="380" r="220" fill="url(#glowGrad)" />

  <!-- Circular Badge Backdrop -->
  <g filter="url(#softShadow)">
    <circle cx="400" cy="360" r="130" fill="#FFFFFF" fill-opacity="0.9" stroke="#EDE6F7" stroke-width="3" />
  </g>

  <!-- Stylized Astromelia Floral Illustration -->
  <g transform="translate(400, 355)" stroke-linecap="round" stroke-linejoin="round">
    <!-- Leaves -->
    <path d="M0,45 C-30,45 -55,70 -45,95 C-25,90 -5,65 0,45 Z" fill="url(#leafGrad)" opacity="0.9" />
    <path d="M0,45 C30,45 55,70 45,95 C25,90 5,65 0,45 Z" fill="url(#leafGrad)" opacity="0.9" />
    
    <!-- Stem -->
    <path d="M0,35 Q0,75 5,110" stroke="url(#leafGrad)" stroke-width="5" fill="none" />

    <!-- Flower Petals (Astromelia style 6 petals) -->
    <!-- Lower Petals -->
    <path d="M0,0 C-35,35 -50,65 -25,80 C0,70 15,40 0,0 Z" fill="url(#petalGrad)" opacity="0.85" />
    <path d="M0,0 C35,35 50,65 25,80 C0,70 -15,40 0,0 Z" fill="url(#petalGrad)" opacity="0.85" />

    <!-- Upper Petals -->
    <path d="M0,0 C-60,-20 -70,-60 -35,-75 C-10,-55 -5,-25 0,0 Z" fill="url(#petalGrad)" opacity="0.92" />
    <path d="M0,0 C60,-20 70,-60 35,-75 C10,-55 5,-25 0,0 Z" fill="url(#petalGrad)" opacity="0.92" />

    <!-- Top Petal -->
    <path d="M0,0 C-25,-55 -20,-85 0,-92 C20,-85 25,-55 0,0 Z" fill="url(#petalGrad)" />

    <!-- Subtle Golden Center & Pistils -->
    <circle cx="0" cy="0" r="10" fill="#C8A66A" />
    <circle cx="-12" cy="-15" r="3" fill="#C8A66A" />
    <circle cx="12" cy="-15" r="3" fill="#C8A66A" />
    <circle cx="0" cy="-22" r="3.5" fill="#C8A66A" />
    <path d="M0,0 L-12,-13 M0,0 L12,-13 M0,0 L0,-20" stroke="#C8A66A" stroke-width="2" />
  </g>

  <!-- Sparkle Stars -->
  <g fill="#C8A66A" opacity="0.8">
    <!-- Sparkle 1 -->
    <path d="M250,260 Q265,260 265,245 Q265,260 280,260 Q265,260 265,275 Q265,260 250,260 Z" />
    <!-- Sparkle 2 -->
    <path d="M530,280 Q542,280 542,268 Q542,280 554,280 Q542,280 542,292 Q542,280 530,280 Z" />
    <!-- Sparkle 3 -->
    <path d="M510,450 Q518,450 518,442 Q518,450 526,450 Q518,450 518,458 Q518,450 510,450 Z" />
  </g>

  <!-- Elegant Brand Typography -->
  <text x="400" y="550" 
        text-anchor="middle" 
        font-family="'Cormorant Garamond', Georgia, serif" 
        font-size="30" 
        font-weight="600" 
        letter-spacing="0.28em" 
        fill="#5C2E8E">
    ASTROMELIA
  </text>

  <text x="400" y="585" 
        text-anchor="middle" 
        font-family="'Poppins', sans-serif" 
        font-size="14" 
        font-weight="500" 
        letter-spacing="0.22em" 
        fill="#9B8AB5">
    DETALLE FLORAL
  </text>

  <!-- Decorative Golden Accent Divider -->
  <line x1="330" y1="615" x2="380" y2="615" stroke="#C8A66A" stroke-width="1.5" stroke-linecap="round" />
  <circle cx="400" cy="615" r="3.5" fill="#C8A66A" />
  <line x1="420" y1="615" x2="470" y2="615" stroke="#C8A66A" stroke-width="1.5" stroke-linecap="round" />
</svg>
